<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Une question très importante...</title>
  <!-- Importation d'une belle police Google -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #333;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 420px;
      width: 90%;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      animation: fadeIn 0.8s ease-out;
    }

    .icon-box {
      font-size: 50px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a2a3a;
      line-height: 1.4;
      margin-bottom: 35px;
    }

    .btn-container {
      position: relative;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    button {
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    #btn-oui {
      background: linear-gradient(135deg, #00b09b, #96c93d);
      color: white;
    }

    #btn-oui:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(0, 176, 155, 0.4);
    }

    #btn-non {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: white;
      z-index: 1000;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-box">🏍️💨</div>
    <h1>Allez-vous acheter la Winner X à Fadel ?</h1>
    
    <div class="btn-container">
      <button id="btn-oui" onclick="accepter()">OUI !</button>
      <button id="btn-non" onmouseover="fuir()" onclick="fuir()" ontouchstart="fuir()">NON</button>
    </div>
  </div>

  <script>
    function fuir() {
      const btnNon = document.getElementById("btn-non");
      
      // Calcul d'une position aléatoire dans l'écran
      const maxX = window.innerWidth - btnNon.offsetWidth - 20;
      const maxY = window.innerHeight - btnNon.offsetHeight - 20;

      const randomX = Math.max(20, Math.floor(Math.random() * maxX));
      const randomY = Math.max(20, Math.floor(Math.random() * maxY));

      btnNon.style.position = "fixed";
      btnNon.style.left = randomX + "px";
      btnNon.style.top = randomY + "px";
    }

    function accepter() {
      alert("🎉 FÉLICITATIONS ! Excellent choix, merci pour la Winner X ! 🥳🏍️");
    }
  </script>

</body>
</html>
